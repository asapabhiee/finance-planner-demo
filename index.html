<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Financial Plan</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 16px;
      font-family: Arial, sans-serif;
      background: #eef5f1;
      color: #18352a;
    }

    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 28px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 24px #18352a18;
    }

    h1 {
      margin-top: 0;
      color: #176b4d;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      font-size: 16px;
      border-radius: 8px;
    }

    input {
      border: 1px solid #b8c9bf;
    }

    button {
      margin-top: 18px;
      border: 0;
      background: #176b4d;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #10553c;
    }

    .secondary {
      background: #e6f0ea;
      color: #18352a;
    }

    .secondary:hover {
      background: #d3e5da;
    }

    #result {
      margin-top: 22px;
      padding: 16px;
      background: #f3f7f4;
      border-radius: 10px;
      line-height: 1.6;
    }

    #status {
      min-height: 24px;
      color: #176b4d;
    }
  </style>
</head>
<body>
  <main>
    <h1>My Financial Plan</h1>
    <p>Enter your monthly amounts to see a simple summary.</p>

    <label for="income">Monthly income (₹)</label>
    <input id="income" type="number" min="0" placeholder="For example, 30000">

    <label for="expenses">Monthly expenses (₹)</label>
    <input id="expenses" type="number" min="0" placeholder="For example, 20000">

    <label for="goal">Monthly savings goal (₹)</label>
    <input id="goal" type="number" min="0" placeholder="For example, 5000">

    <button onclick="makePlan()">Show my summary</button>
    <button class="secondary" onclick="savePlan()">Save my plan on this device</button>
    <button class="secondary" onclick="clearPlan()">Clear saved plan</button>

    <div id="result"></div>
    <p id="status"></p>
  </main>

  <script>
    function makePlan() {
      const incomeField = document.getElementById("income");
      const expensesField = document.getElementById("expenses");
      const goalField = document.getElementById("goal");
      const result = document.getElementById("result");

      if (incomeField.value === "" || expensesField.value === "" || goalField.value === "") {
        result.textContent = "Please fill in all three amounts.";
        return;
      }

      const income = Number(incomeField.value);
      const expenses = Number(expensesField.value);
      const goal = Number(goalField.value);
      const remaining = income - expenses;

      const message = remaining >= goal
        ? "Your savings goal fits within the money left."
        : "Your savings goal is higher than the money left.";

      result.innerHTML =
        "<h2>Your monthly summary</h2>" +
        "<p>Money left after expenses: ₹" + remaining.toLocaleString("en-IN") + "</p>" +
        "<p>Savings goal: ₹" + goal.toLocaleString("en-IN") + "</p>" +
        "<p>" + message + "</p>";
    }

    function savePlan() {
      const plan = {
        income: document.getElementById("income").value,
        expenses: document.getElementById("expenses").value,
        goal: document.getElementById("goal").value
      };

      if (plan.income === "" || plan.expenses === "" || plan.goal === "") {
        document.getElementById("status").textContent = "Fill in all three amounts before saving.";
        return;
      }

      localStorage.setItem("myFinancialPlan", JSON.stringify(plan));
      document.getElementById("status").textContent = "Plan saved in this browser on this device.";
    }

    function clearPlan() {
      localStorage.removeItem("myFinancialPlan");
      document.getElementById("income").value = "";
      document.getElementById("expenses").value = "";
      document.getElementById("goal").value = "";
      document.getElementById("result").textContent = "";
      document.getElementById("status").textContent = "Saved plan cleared from this browser.";
    }

    window.onload = function() {
      const savedPlan = localStorage.getItem("myFinancialPlan");

      if (savedPlan) {
        const plan = JSON.parse(savedPlan);
        document.getElementById("income").value = plan.income;
        document.getElementById("expenses").value = plan.expenses;
        document.getElementById("goal").value = plan.goal;
        document.getElementById("status").textContent = "Loaded your saved plan from this browser.";
      }
    };
  </script>
</body>
</html>
